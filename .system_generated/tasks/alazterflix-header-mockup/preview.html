#af-header-styles &gt; section { min-height:480px; }
#af-header-styles .af-product { box-sizing:border-box; min-height:465px; color:var(--af-text); background:var(--af-bg); border:1px solid #1c2734; border-radius:16px; overflow:visible; padding:26px 24px 0; --af-nav-size:15px; }
#af-header-styles .af-product * { box-sizing:border-box; }
#af-header-styles .af-header { position:relative; display:grid; grid-template-columns:minmax(0,1fr) 48px; align-items:center; gap:22px 18px; padding-bottom:25px; border-bottom:1px solid #1c2734; }
#af-header-styles .af-identity { display:flex; align-items:center; gap:22px; min-width:0; }
#af-header-styles .af-logo { background-image:var(--af-logo); background-repeat:no-repeat; background-position:center; background-size:contain; width:174px; height:58px; flex-shrink:0; }
#af-header-styles .af-slogan { color:var(--af-muted); font-size:12px; line-height:1.8; }
#af-header-styles .af-settings { display:flex; align-items:center; justify-content:center; width:48px; height:48px; padding:0; color:var(--af-muted); background:transparent; border:1px solid transparent; border-radius:14px; transition:background .18s,color .18s; }
#af-header-styles .af-settings svg { width:27px; height:27px; stroke-width:1.7; }
#af-header-styles .af-settings:hover,#af-header-styles .af-settings[aria-expanded=&quot;true&quot;] { color:var(--af-cyan); background:var(--af-surface); border-color:var(--af-border); }
#af-header-styles .af-search { grid-column:1/-1; display:flex; align-items:center; gap:12px; width:min(470px,100%); height:48px; padding:0 16px; background:var(--af-surface); color:var(--af-muted); border:1px solid var(--af-border); border-radius:14px; transition:border-color .2s,box-shadow .2s; }
#af-header-styles .af-search:focus-within { border-color:var(--af-cyan); box-shadow:0 0 0 3px #60e7ed12; }
#af-header-styles .af-search svg { width:21px; height:21px; flex-shrink:0; }
#af-header-styles .af-search input { width:100%; min-width:0; height:100%; border:0; color:var(--af-text); background:transparent; font:400 14px Inter,&quot;Segoe UI&quot;,sans-serif; }
#af-header-styles .af-search input::placeholder { color:#9cacc2; }
#af-header-styles .af-search kbd { display:flex; align-items:center; justify-content:center; width:24px; height:24px; flex-shrink:0; font-size:12px; font-family:inherit; color:#788da5; border:1px solid var(--af-border); border-radius:6px; }
#af-header-styles .af-settings-menu { position:absolute; z-index:4; top:56px; right:0; display:grid; gap:17px; width:230px; padding:22px; border:1px solid var(--af-border); border-radius:15px; background:var(--af-surface); box-shadow:0 18px 45px #0007; font-size:13px; }
#af-header-styles .af-settings-menu[hidden] { display:none; }
#af-header-styles .af-settings-menu span { color:var(--af-muted); }
#af-header-styles .af-categories { display:flex; flex-wrap:wrap; gap:9px; padding:22px 0; }
#af-header-styles .af-category { display:flex; align-items:center; justify-content:center; gap:8px; min-height:46px; padding:11px 15px; border:1px solid var(--af-border); border-radius:14px; background:var(--af-surface); color:var(--af-muted); font-family:inherit; font-size:var(--af-nav-size); font-weight:600; white-space:nowrap; transition:background .18s,color .18s,border-color .18s; }
#af-header-styles .af-category svg { width:19px; height:19px; flex-shrink:0; stroke-width:1.8; }
#af-header-styles .af-category:hover { color:var(--af-text); background:var(--af-hover); border-color:#40506a; }
#af-header-styles .af-category[aria-pressed=&quot;true&quot;] { color:#fff; background:var(--af-red); border-color:var(--af-red); box-shadow:0 4px 18px #ed10362b; }
#af-header-styles .af-context { display:flex; align-items:center; gap:10px; border-top:1px solid #1c2734; padding:21px 0 24px; font-size:18px; }
#af-header-styles .af-context-line { width:3px; height:19px; border-radius:2px; background:var(--af-red); }
#af-header-styles .af-segmented .af-search { border-radius:24px; }
#af-header-styles .af-segmented .af-categories { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:3px; padding:5px; margin:22px 0; background:var(--af-surface); border:1px solid var(--af-border); border-radius:16px; }
